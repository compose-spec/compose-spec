name: Sync compose-spec json

on:
  workflow_dispatch:
  # sent by compose-go when a merge on main changes schema/compose-spec.json
  repository_dispatch:
    types: [compose-go-schema-updated]

# runs are serialized so that the last merge in compose-go is also the last one
# to update the pull request
concurrency:
  group: sync-compose-spec-json
  cancel-in-progress: false

jobs:
  schema:
    name: Update Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download schema
        env:
          # the exact compose-go commit that triggered the run, so that we never
          # read a stale cached copy of main; a manual run takes main
          REF: ${{ github.event.client_payload.sha || 'main' }}
        run: |
          if [ "$REF" != main ] && ! echo "$REF" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::unexpected compose-go ref: $REF"
            exit 1
          fi
          curl -fSL -o schema/compose-spec.json "https://raw.githubusercontent.com/compose-spec/compose-go/${REF}/schema/compose-spec.json"

      - name: Show diff
        run: git diff schema/compose-spec.json

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          title: Update compose-spec.json
          commit-message: Update compose-spec.json
          signoff: true
          branch: compose-spec-json
